sonar.projectKey=storytold_artcraft
sonar.organization=storytold

# CI only publishes the Rust lcov report, so TypeScript and JavaScript never
# appear covered. Same idea as anicraft excluding JS/PowerShell/Python, and
# as filmcraft and lightcraft excluding tools/docs/examples.
sonar.coverage.exclusions=**/*.ts,**/*.tsx,**/*.js,**/*.jsx


# Not analysed: code that isn't ArtCraft's or isn't run by the app or CI.
# - crates/vendor/: third-party crates kept in the tree.
# - The Python beside the Grok and Sora clients: the upstream reference implementations the Rust ports
#   cite ("Based on Grok-Api/core/xctid.py"); nothing runs them.
# - frontend/scripts/unix-dev.mjs and frontend/tools/performance/: developer tools run by hand
#   (script/artcraft/unix_dev.sh, `npm run perf:desktop`); they start git, cargo and a browser from
#   the developer's own PATH and write where the developer says.
sonar.exclusions=crates/vendor/**,crates/api_clients/grok_consumer_client/src/credentials/_metadata/**,crates/api_clients/openai_sora_client/src/requests/auth_sentinel_2/metadata/python_impl/**,frontend/scripts/unix-dev.mjs,frontend/tools/performance/**

# S4347 (predictable seed): DeterministicRng is the fixed-seed generator for tests and dev seed
# tools; being reproducible is its purpose.
sonar.issue.ignore.multicriteria=deterministic_rng
sonar.issue.ignore.multicriteria.deterministic_rng.ruleKey=rust:S4347
sonar.issue.ignore.multicriteria.deterministic_rng.resourceKey=crates/schema/public/tokens/src/deterministic_rng.rs
