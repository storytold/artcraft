
name: Native Rust Tests

on:
  push:
    branches:
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test native application
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run regression test
        run: cargo test -p artcraft_native attempt_failed_status_is_still_running
