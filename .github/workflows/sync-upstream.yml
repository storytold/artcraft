
name: Sync Artcraft from Upstream

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-artcraft-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync main branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout personal repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch original repository
        run: |
          git remote add upstream \
            https://github.com/storytold/artcraft.git
          git fetch upstream main

      - name: Fast-forward to upstream main
        run: |
          git checkout main
          git merge --ff-only upstream/main

      - name: Push changes to personal repository
        run: |
          git push origin main
