name: "Artcraft Linux Publish"

on:
  push:
    branches:
      - release
      - artcraft-release
      - artcraft-linux

jobs:
  publish-artcraft-linux:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf curl wget build-essential cmake
          # wreq dependencies if any
          sudo apt-get install -y pkg-config nasm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install frontend dependencies
        run: |
          cd ./frontend
          npm cache clean --force
          npm ci
          
      - name: Pre-build frontend
        run: |
          cd ./frontend
          export NODE_OPTIONS="--max-old-space-size=8192"
          npx nx run artcraft:build
          
          # Update Tauri config to skip the build
          cd ${{ github.workspace }}/crates/desktop/artcraft
          cp tauri.conf.json tauri.conf.json.bak
          jq '.build.beforeBuildCommand = ""' tauri.conf.json.bak > tauri.conf.json

      - name: build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SQLX_OFFLINE: true
        with:
          projectPath: ./crates/desktop/artcraft
          tagName: artcraft-v__VERSION__
          releaseName: "ArtCraft v__VERSION__"
          releaseBody: "Production build of ArtCraft. See the assets below to download and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
