name: "Artcraft Linux Publish"

on:
  push:
    branches:
      - release
      - artcraft-release
      - artcraft-linux  # Additional branch for Linux testing

# This workflow creates Linux builds (AppImage, .deb, and .rpm).
# On each push to the release branches it will create or update a GitHub release, build your app, and upload the artifacts to the release.

jobs:
  publish-artcraft-linux:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # NB: Build on the oldest supported Ubuntu so the AppImage links against an old glibc
          # and runs on as many distributions as possible.
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install Tauri and wreq dependencies
        run: |
          sudo apt-get update
          # Tauri: https://v2.tauri.app/start/prerequisites/#linux
          # wreq (BoringSSL): cmake, clang, libclang-dev
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            curl \
            file \
            libayatana-appindicator3-dev \
            libclang-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install frontend dependencies
        run: |
          # Navigate to the frontend directory to install dependencies
          cd ./frontend

          npm cache clean --force

          echo "Installing all workspace dependencies..."
          npm ci

          echo "=== Version Information ==="
          echo "Node version:"
          node --version
          echo "NPM version:"
          npm --version

          echo "=== Nx versions from lockfile ==="
          npm list --depth=0 | grep nx

      - name: Pre-build frontend to avoid Tauri build issues
        run: |
          # Build the frontend app from the correct directory
          cd ./frontend

          # Increase Node.js memory limit for the build
          export NODE_OPTIONS="--max-old-space-size=8192"

          # Use npx to ensure we use the local nx version
          echo "Building with npx nx..."
          npx nx run artcraft:build

          echo "Checking build output..."
          ls -la apps/artcraft/dist/ | head -10

          # Update Tauri config to skip the build (since we already built)
          cd ${{ github.workspace }}/crates/desktop/artcraft
          cp tauri.conf.json tauri.conf.json.bak
          jq '.build.beforeBuildCommand = ""' tauri.conf.json > tauri.conf.json.tmp
          mv tauri.conf.json.tmp tauri.conf.json

      - name: build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use the SQLx query cache for SQLite
          SQLX_OFFLINE: true
        with:
          projectPath: ./crates/desktop/artcraft
          tagName: artcraft-v__VERSION__ # the action automatically replaces __VERSION__ with the app version.
          releaseName: "ArtCraft v__VERSION__"
          releaseBody: "See the assets below to download this version and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
