name: docs-check

on:
  pull_request:
    paths: ["docs/user/**"]
  push:
    branches: [main]
    paths: ["docs/user/**"]

permissions:
  contents: read

env:
  # Shared docs checker from storytold/artcraft-services, pinned to one commit
  # and its SHA-256. To update it, change both values in a reviewed PR.
  CHECKER_COMMIT: 4db0e30fe2c57a1c4c49e390e3711f90910b8d23
  CHECKER_SHA256: bd6b610a708b85fd0aa0491c459bd2800b716e0b8050516fea79e084cfb2a624

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the pinned docs checker
        run: |
          url="https://raw.githubusercontent.com/storytold/artcraft-services/$CHECKER_COMMIT/frontend/apps/artcraft-website-next/scripts/docs/core.mjs"
          curl -fsSL "$url" -o "$RUNNER_TEMP/docs-core.mjs"
          echo "$CHECKER_SHA256  $RUNNER_TEMP/docs-core.mjs" | sha256sum -c -
      - name: Check docs/user
        run: node "$RUNNER_TEMP/docs-core.mjs" docs/user
