app-id: ai.artcraft.app
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: artcraft

finish-args:
  - --device=dri
  - --filesystem=home
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=wayland

modules:
  - name: artcraft
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      build-args:
        - --share=network
      env:
        CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        SQLX_OFFLINE: "true"
    build-commands:
      - cargo build --release --locked -p artcraft
      - install -Dm755 target/release/artcraft /app/bin/artcraft
      - install -Dm644 .github/flatpak/ai.artcraft.app.desktop /app/share/applications/ai.artcraft.app.desktop
      - install -Dm644 .github/flatpak/ai.artcraft.app.metainfo.xml /app/share/metainfo/ai.artcraft.app.metainfo.xml
      - install -Dm644 crates/desktop/artcraft/icons/64x64.png /app/share/icons/hicolor/64x64/apps/ai.artcraft.app.png
      - install -Dm644 crates/desktop/artcraft/icons/128x128.png /app/share/icons/hicolor/128x128/apps/ai.artcraft.app.png
    sources:
      - type: dir
        path: ../..
