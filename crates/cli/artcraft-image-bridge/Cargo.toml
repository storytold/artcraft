[package]
name = "artcraft-image-bridge"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
authors = ["Emile du Toit (BrainIT Consulting)"]

# Isolate this initial experiment from the desktop dependency graph.
[workspace]

[dependencies]
anyhow = "1"
fs2 = "0.4"
same-file = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rmcp = { version = "=3.5.1", features = ["server", "client", "transport-io", "transport-child-process"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "multipart", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "time", "process"] }
uuid = { version = "1", features = ["v4", "serde"] }
