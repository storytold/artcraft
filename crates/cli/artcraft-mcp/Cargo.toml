[package]
name = "artcraft-mcp"
edition = "2021"
version = "0.1.0"
authors = ["ArtCraft MCP Team"]
publish = false

[[bin]]
name = "artcraft-mcp"
path = "src/main.rs"

[dependencies]
# Workspace hack (faster compile times)
workspace-build-acceleration.workspace = true

# Internal
artcraft_api_defs.workspace = true
artcraft_client.workspace = true
enums.workspace = true
errors.workspace = true
tokens.workspace = true
uuid_utils.workspace = true

# External
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_derive.workspace = true
tokio.workspace = true

# Logging
env_logger = "0.11"

# System dirs
dirs = "5.0"

# Token generation
uuid.workspace = true

# URL encoding for query params
urlencoding = "2.1"

# HTTP client for raw requests
reqwest = { version = "0.12", features = ["json"] }

# MCP / JSON-RPC
# Using manual JSON-RPC implementation over stdio for minimal dependencies
