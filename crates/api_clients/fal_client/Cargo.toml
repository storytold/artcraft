[package]
name = "fal_client"
edition = "2021"
rust-version = "1.75" # MSRV: async traits
version = "0.0.1"
publish = false

[lib]
name = "fal_client"
path = "src/lib.rs"

[dependencies]

# Internal
errors.workspace = true
file_to_base64_url.workspace = true

# External
anyhow.workspace = true
futures.workspace = true
log.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
# Internal Dev
test_utils.workspace = true
test_data.workspace = true

# External Dev
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util"] }
