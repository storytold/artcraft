[package]
name = "midjourney_client"
edition = "2024"
version = "0.0.1"
publish = false

[lib]
name = "midjourney_client"
path = "src/lib.rs"

[dependencies]
# Internal
browser_emulation.workspace = true
cloudflare_errors.workspace = true
cookie_store_wrapper = { workspace = true, features = ["wreq"] }
errors.workspace = true

# External
anyhow.workspace = true
futures.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["full"] }
url.workspace = true
wreq-util.workspace = true
wreq.workspace = true

# NB: We need to parse HTML to get out the websocket token
dom_query = "0.20.2"

# NB: Midjourney's websocket sends server->client frames as CBOR.
ciborium = "0.2"

[dev-dependencies]
filesys.workspace = true
test_data.workspace = true
test_utils.workspace = true
